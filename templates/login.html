<!DOCTYPE html>

<html>

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>VPN Panel - Login</title>

    <link
        rel="stylesheet"
        href="/static/style.css"
    >

</head>

<body class="login-page">

<div class="login-box">

    <div class="login-logo">
        VPN<span>Panel</span>
    </div>

    <h1>Welcome back</h1>

    <p class="login-subtitle">
        Sign in to your dashboard
    </p>

    {% if error %}

    <div class="error">
        {{ error }}
    </div>

    {% endif %}

    <form method="post" action="/login">

        <input
            type="text"
            name="username"
            placeholder="Username"
            required
        >

        <input
            type="password"
            name="password"
            placeholder="Password"
            required
        >

        <button type="submit">
            Sign in
        </button>

    </form>

</div>

</body>

</html>
